name: fde-vscode

on:
  push:
    paths: ['fde-vscode/**', '.github/workflows/fde-vscode.yml']
  pull_request:
    paths: ['fde-vscode/**', '.github/workflows/fde-vscode.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fde-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fde-vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: fde-vscode-vsix
          path: fde-vscode/*.vsix
